[project]
name = "spot-futures-arbitrage-basis-monitor"
version = "0.1.0"
description = "A real-time application that listens to Binance Spot and USDT-M Futures WebSocket streams, calculates the spot–futures basis, and applies a funding-rate filter to determine whether a spot–futures arbitrage opportunity is worth entering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "asyncio>=4.0.0",
    "pydantic-settings>=2.12.0",
    "python-binance>=1.0.34",
]
